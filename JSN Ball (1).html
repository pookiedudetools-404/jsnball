<!DOCTYPE html>
<html lang="bn"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>JSN Ball</title>
<style>
:root{--bg:#0b0912;--panel:#15111f;--text:#f4f1fa;--muted:#9a93ad;--accent:#ff6b35;color-scheme:dark}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0912}}
:root[data-theme="dark"]{--bg:#0b0912}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;overflow:hidden;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(620px,100vw);height:min(940px,98vh);background:var(--panel);border-radius:18px;overflow:hidden;box-shadow:0 20px 60px #000a}
canvas{display:block;width:100%;height:100%;touch-action:none}
h1{font-size:1.5rem;margin:0;font-weight:800}h1 b{background:linear-gradient(90deg,#ff8a4c,#ffd23f,#ff5d73,#ff8a4c);background-size:200% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:sh 3s linear infinite}@keyframes sh{to{background-position:-200% 0}}h1 span{display:inline-block;animation:fl 1.6s ease-in-out infinite}@keyframes fl{50%{transform:translateY(-3px) rotate(-8deg)}}
.sub{color:var(--muted);font-size:.82rem}
.row{display:flex;gap:10px;justify-content:center}
#setup{position:absolute;left:0;right:0;bottom:0;top:150px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:11px;padding:14px 18px;text-align:center;background:linear-gradient(180deg,#15111f00,#15111f 34px)}
.pick{width:44px;height:44px;border-radius:50%;border:2px solid var(--muted);background:transparent;color:var(--text);font-weight:700;font-size:1.05rem;cursor:pointer}
.pick.active{border-color:var(--accent);background:var(--accent);color:#1a1625}
#nameRows{display:flex;flex-direction:column;gap:7px;width:100%;align-items:center}
.nameRow{display:flex;align-items:center;gap:10px;width:100%;max-width:280px}
.dot{width:18px;height:18px;border-radius:50%;flex:none}
input[type=text]{flex:1;min-width:0;padding:9px 12px;border-radius:10px;border:1px solid #332e45;background:#241f33;color:var(--text);font-size:.9rem}
input[type=text]:focus{outline:2px solid var(--accent)}
.cta{margin-top:4px;padding:12px 28px;border-radius:40px;border:none;background:var(--accent);color:#1a1625;font-weight:800;font-size:1rem;cursor:pointer}
.cta:disabled{opacity:.4;cursor:not-allowed}
#hud{position:absolute;left:8px;right:8px;bottom:10px;display:none;gap:7px;z-index:3}
#hud button{flex:1;min-width:0;max-width:96px;height:58px;margin:0 auto;border:0;border-radius:18px;color:#150f1f;font-weight:800;font-size:.78rem;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;box-shadow:0 5px 0 #0007;transition:transform .08s,filter .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.2;cursor:pointer}
#hud span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
#hud small{font-weight:600;opacity:.65;font-size:.62rem}
#hud button.down{transform:translateY(4px);box-shadow:0 1px 0 #0007}
#hud button.used{filter:grayscale(.7) brightness(.55);pointer-events:none}
#hud button.ready{outline:2px solid #b58cff;animation:rd 1s infinite}
@keyframes rd{50%{box-shadow:0 0 22px 6px #a66bffcc}}
#tip{position:absolute;left:0;right:0;bottom:76px;text-align:center;font-size:.72rem;color:var(--muted);pointer-events:none;display:none}
#winO{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-end;gap:14px;background:linear-gradient(180deg,rgba(11,9,18,.15),rgba(11,9,18,.88) 60%);text-align:center;padding:20px 20px 90px;z-index:5}
#winO h2{font-size:1.5rem;margin:0}
#rank{font-weight:700;font-size:1rem;line-height:1.7;text-align:left}
#hud button.pow{animation:pw 1s infinite}@keyframes pw{50%{box-shadow:0 0 18px 5px #ffd34dcc,0 5px 0 #0007}}
#mute{position:absolute;top:8px;right:8px;z-index:6;width:34px;height:34px;border-radius:50%;border:1px solid #4a3f6b;background:#241f33cc;color:#fff;font-size:15px;cursor:pointer}
</style></head><body>
<div id="stage"><div id="wrap">
<canvas id="c"></canvas>
<div id="setup"><h1><span>🐉</span> <b>JSN Ball</b></h1><div class="sub">কতজন খেলবে? নাম দাও, তারপর শুরু</div><div class="row" id="countRow"></div><div id="nameRows"></div><button class="cta" id="startBtn" disabled>শুরু করো</button></div>
<div id="tip">বাটন চেপে ধরো — ছাড়লেই বল পড়বে</div>
<div id="hud"></div><button id="mute" aria-label="sound">🔊</button>
<div id="winO"><h2 id="winT"></h2><div id="rank"></div><button class="cta" id="again">New Game</button></div>
</div></div>
<script>
(()=>{
const COL=['#ff5d73','#5ec8ff','#ffd23f','#7ee787','#c792ea'];
const $=id=>document.getElementById(id);
let cx,T=0,mute=false,AC=null,chs=[];const bufs={},icons=[];const cv=$('c'),wrap=$('wrap'),setup=$('setup'),countRow=$('countRow'),nameRows=$('nameRows'),startBtn=$('startBtn'),winO=$('winO'),winT=$('winT'),hud=$('hud'),tip=$('tip');
const R=18,G=.32,CT=46,CF=122,PA=1.2,PB=10,PC=1.2;
const CH=[{c:'#ffd34d',b:'#f2b632',t:'#2b1a00'},{c:'#bfe6ff',b:'#f4f8fc',t:'#10222e'},{c:'#3ee0ff',b:'#2f7bff',t:'#00122e'},{c:'#8a4dff',b:'#1a1326',t:'#f1e8ff'},{c:'#e0a85a',b:'#7a4a22',t:'#ffffff'}];
let W=0,H=0,DPR=1,n=0,names=[],balls=[],traps=[],btns=[],hold=[],fx=[],L=0,mode='setup',over=false,win=null,cam=0,sim=0,ts=1,dim=0,shake=0,nextRoar=9,banner=0,bdir=1,ps=[],star=null,zoom=1,bi=0,bprev=0,bfade=0,zb=0,zt='',lastFl=0;
const dots=Array.from({length:50},()=>({x:Math.random()*600,y:Math.random()*3000,r:1+Math.random()*2,f:.3+Math.random()*.4}));
cx=cv.getContext('2d');
function resize(){DPR=Math.min(devicePixelRatio||1,2);const r=wrap.getBoundingClientRect();W=r.width;H=r.height;cv.width=W*DPR;cv.height=H*DPR;if(mode==='setup')layout()}
addEventListener('resize',resize);
function layout(){const cw=Math.min(66,W/(n+1)-8);balls.forEach((b,i)=>{b.cx=W*(i+1)/(n+1);b.cw=cw;if(b.state==='case'){b.x=b.cx;b.y=CF-R-3}})}
function mkBalls(){balls=names.slice(0,n).map((nm,i)=>({i,name:nm,ch:chs[i],color:CH[chs[i]].c,base:CH[chs[i]].b,tc:CH[chs[i]].t,state:'case',x:0,y:0,vx:0,vy:0,trail:[],still:0,hatch:0,pt:0,s:1,ph:0}));layout()}
for(let i=1;i<=5;i++){const b=document.createElement('button');b.className='pick';b.textContent=i;b.onclick=()=>pickN(i);countRow.append(b)}
function pickN(k){n=k;[...countRow.children].forEach((b,i)=>b.classList.toggle('active',i<k));
 names=Array.from({length:k},(_,i)=>names[i]||'');chs=chs.slice(0,k);for(let i=0;i<k;i++)if(chs[i]===undefined){let c=0;while(chs.includes(c))c++;chs[i]=c}nameRows.innerHTML='';icons.length=0;
 names.forEach((nm,i)=>{const r=document.createElement('div');r.className='nameRow';const d=document.createElement('canvas');d.width=d.height=68;d.style.cssText='width:34px;height:34px;flex:none;cursor:pointer;border-radius:50%;background:#241f33;border:1px solid #4a3f6b';d.onclick=()=>cycle(i);icons[i]=d;const p=document.createElement('input');p.type='text';p.maxLength=10;p.value=nm;p.placeholder='Ball '+(i+1)+' নাম';p.oninput=()=>{names[i]=p.value.trim();if(balls[i])balls[i].name=names[i];ready()};r.append(d,p);nameRows.append(r)});
 mkBalls();ready();drawIcons()}
function setCh(b,k){const c=CH[k];b.ch=k;b.color=c.c;b.base=c.b;b.tc=c.t}
function cycle(i){let k=chs[i];do{k=(k+1)%5}while(chs.some((c,j)=>j!==i&&c===k));chs[i]=k;if(balls[i])setCh(balls[i],k)}
function drawIcons(){const m=cx;icons.forEach((c,i)=>{cx=c.getContext('2d');cx.setTransform(2,0,0,2,0,0);cx.clearRect(0,0,34,34);const k=chs[i];ball({ch:k,color:CH[k].c,base:CH[k].b,state:'case'},17,19,9)});cx=m}
function ready(){startBtn.disabled=!(n&&names.every(x=>x))}

const rn=(a,b)=>a+Math.random()*(b-a),sg=()=>Math.random()<.5?-1:1;
function build(){const N=70+(Math.random()*21|0);L=460+N*165;traps=[];
 const K=['peg','peg','bar','bar','spin','spin','slide','funnel','pad','dragon','dragon'];
 for(let i=0;i<N;i++){const y=300+i*(L-640)/N+rn(-14,14),k=K[Math.random()*K.length|0],o={k,y};
  if(k==='peg'){o.p=[];const m=3+(Math.random()*3|0);for(let j=0;j<m;j++){const t=Math.random()<.3;o.p.push({x:rn(30,W-30),y:y+rn(-30,30),r:t?13:7,t})}}
  else if(k==='bar'){o.x=rn(60,W-60);o.l=rn(45,80);o.a=sg()*rn(.35,.85)}
  else if(k==='spin'){o.x=rn(70,W-70);o.l=rn(55,80);o.w=sg()*rn(1.6,3.2);o.a=rn(0,6.28)}
  else if(k==='slide'){o.l=110;o.amp=(W-o.l)/2-12;o.sp=rn(1,2.4);o.ph=rn(0,6.28)}
  else if(k==='funnel'){o.gx=W*rn(.25,.75);o.g=30}
  else{o.s=Math.random()<.5?0:1;o.ph=rn(0,4)}
  traps.push(o)}}
function geo(o){const y=o.y;switch(o.k){
 case'peg':return o.p.map(p=>[p.x,p.y,p.x,p.y,p.r,p.t?1:0]);
 case'bar':{const c=Math.cos(o.a)*o.l,s=Math.sin(o.a)*o.l;return[[o.x-c,y-s,o.x+c,y+s,6,0]]}
 case'spin':{const a=o.a+o.w*sim,c=Math.cos(a)*o.l,s=Math.sin(a)*o.l;return[[o.x-c,y-s,o.x+c,y+s,6,2,o]]}
 case'slide':{const x=W/2+Math.sin(sim*o.sp+o.ph)*o.amp;return[[x-o.l/2,y,x+o.l/2,y,7,0]]}
 case'funnel':return[[0,y-34,o.gx-o.g,y+8,6,0],[W,y-34,o.gx+o.g,y+8,6,0]];
 case'dragon':{const x=o.s?W-18:18;return[[x,y,x,y,16,0]]}
 default:{const x=o.s?W-46:46;return[[x-34,y+7,x+34,y-7,6,3]]}}}
function emote(x,y,t){if(fx.length<40)fx.push({x,y,vx:rn(-.5,.5),vy:-1.1,l:1,t})}
function firing(o){return(sim+o.ph)%4>=3}
function flame(b,o,dt){if(!firing(o))return;const d=o.s?-1:1,hx=o.s?W-18:18,dx=(b.x-hx)*d;if(dx>0&&dx<W*.75&&Math.abs(b.y-o.y)<28){b.hot=1.2;b.vx+=d*.8*dt;b.vy-=.55*dt;if(Math.random()<.05)emote(b.x,b.y,'🔥')}}
function roar(){const fl=balls.filter(b=>b.state==='fall'),ld=fl.length>1?fl.reduce((a,b)=>b.y>a.y?b:a):null;balls.forEach(b=>b.lead=b===ld);star=ld||fl[0]||balls.find(b=>b.state==='portal'&&!b.fin)||null;const tl=fl.length>1?fl.reduce((a,b)=>b.y<a.y?b:a):null;balls.forEach(b=>b.last=!!tl&&b===tl&&ld.y-tl.y>350);
 if(fl.length&&sim>nextRoar){nextRoar=sim+rn(9,15);bdir=sg();fl.forEach(b=>{b.vx+=bdir*rn(2.5,4.5);b.vy*=.6});shake=9;banner=1.8;play('roar',1)}}
function hit(b,s){const[x1,y1,x2,y2,rd,f,o]=s,dx=x2-x1,dy=y2-y1,l2=dx*dx+dy*dy;
 let t=l2?((b.x-x1)*dx+(b.y-y1)*dy)/l2:0;t=t<0?0:t>1?1:t;
 const px=x1+dx*t,py=y1+dy*t;let nx=b.x-px,ny=b.y-py;const d=Math.hypot(nx,ny),m=R+rd;
 if(d>=m)return;if(d<.001){nx=0;ny=-1}else{nx/=d;ny/=d}
 b.x=px+nx*m;b.y=py+ny*m;const vn=b.vx*nx+b.vy*ny;
 if(vn<0){const e=f===3?1.55:.55;b.vx-=(1+e)*vn*nx;b.vy-=(1+e)*vn*ny;b.vx+=(Math.random()-.5)*(f===1?5:1.2);
  if(f===2){b.diz=1.4;const w=o.w/60;b.vx+=-w*(py-o.y);b.vy+=w*(px-o.x)}
  if(f===1&&Math.random()<.6&&(tone(200,600,.15,'triangle',.18),1))emote(b.x,b.y,Math.random()<.5?'😂':'🤡');
  if(f===3&&(tone(500,1200,.15,'sawtooth',.12),1))emote(b.x,b.y,'⚡')}}
function physics(dt){
 for(const b of balls){if(b.state!=='fall')continue;
  b.vy=Math.min(b.vy+G*(b.glide>0?.3:1)*dt,b.glide>0?5:12.5);b.x+=b.vx*dt;b.y+=b.vy*dt;b.vx*=1-(b.y/L>=.25&&b.y/L<.5?.0004:.002)*dt;if(b.stun>0){b.vx*=1-.1*dt;b.vy*=1-.1*dt}
  if(b.x<R){b.x=R;b.vx=Math.abs(b.vx)*.6}if(b.x>W-R){b.x=W-R;b.vx=-Math.abs(b.vx)*.6}
  if(!(b.ghost>0))for(const o of traps){if(Math.abs(o.y-b.y)>210)continue;if(o.k==='dragon')flame(b,o,dt);for(const s of geo(o))hit(b,s)}
  b.still=Math.hypot(b.vx,b.vy)<.5?b.still+dt:0;if(b.still>50){b.vx+=rn(-2.5,2.5);b.vy-=2;b.still=0}
  if(b.y+R>=L&&!over)finish(b,false)}
 for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){const a=balls[i],c=balls[j];if(a.state!=='fall'||c.state!=='fall')continue;
  let dx=c.x-a.x,dy=c.y-a.y;const d=Math.hypot(dx,dy);
  if(d<2*R&&d>.001){dx/=d;dy/=d;const ov=(2*R-d)/2;a.x-=dx*ov;a.y-=dy*ov;c.x+=dx*ov;c.y+=dy*ov;const rv=(c.vx-a.vx)*dx+(c.vy-a.vy)*dy;if(rv<0){a.vx+=rv*dx;a.vy+=rv*dy;c.vx-=rv*dx;c.vy-=rv*dy}}}}
function finish(b,p){over=true;win=b;b.fin=true;b.portal=p;b.t0=performance.now();shake=12;star=b;zb=1.6;zt='📸 PHOTO FINISH!';setTimeout(()=>play('laugh',1),p?600:150);if(!p){b.state='done';[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tone(f,f,.25,'triangle',.18),i*110))}
 for(let i=0;i<50;i++)fx.push({x:b.x,y:b.y,vx:rn(-4,4),vy:rn(-8,0),l:1.6,c:COL[i%5]});
